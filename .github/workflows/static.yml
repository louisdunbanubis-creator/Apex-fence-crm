name: Validate Apex Fence CRM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f crm.html
          test -f app.js
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f functions/api/lead.js
          test -f functions/api/leads.js
          test -f functions/api/photo.js
          test -f functions/_middleware.js
          test -f migrations/0001_online_leads.sql
          test -f wrangler.jsonc.example
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check functions/api/lead.js
          node --check functions/api/leads.js
          node --check functions/api/photo.js
          node --check functions/_middleware.js